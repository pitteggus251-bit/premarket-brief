<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장전 브리핑</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2433;--sub:#6b7280;--line:#e5e2d8;--accent:#e8590c;--ai:#fff8e6;--aiLine:#f1dca0;--chip:#eef0f4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1d222b;--ink:#e8eaee;--sub:#9aa3b2;--line:#2b313c;--ai:#2a2616;--aiLine:#5a4c20;--chip:#2a303b}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1d222b;--ink:#e8eaee;--sub:#9aa3b2;--line:#2b313c;--ai:#2a2616;--aiLine:#5a4c20;--chip:#2a303b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR",-apple-system,"Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:20px;margin:0}
.date{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 4px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.add{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:0 16px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:flex;align-items:center;gap:5px;background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:3px 6px 3px 4px;font-size:12px}
.rank{background:#4b5563;color:#fff;border-radius:99px;padding:0 7px;font-size:11px;font-weight:700}
.chip.top .rank{background:var(--accent)}
.chip small{color:var(--sub)}
.chip .x{border:0;background:none;color:var(--sub);padding:0 2px;font-size:14px}
.load{width:100%;padding:14px;font-size:15px;font-weight:700;color:var(--ink)}
.status{text-align:center;font-size:12px;color:#16a34a;margin:-4px 0 14px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-h h2{font-size:16px;margin:0}
.badge{font-size:11px;border-radius:99px;padding:2px 8px;margin-left:6px;background:#fff1e6;color:var(--accent);border:1px solid #f7c9a6}
.cnt{font-size:12px;color:var(--sub)}
.news{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px;font-size:13px}
.news a{color:var(--ink);text-decoration:none}
.news span{color:var(--sub);font-size:11px;white-space:nowrap}
.ai{background:var(--ai);border:1px solid var(--aiLine);border-radius:10px;padding:10px;font-size:13px;margin-top:10px}
.ai b.tag{font-size:11px;background:#dbeafe;color:#1d4ed8;border-radius:4px;padding:1px 6px;margin-left:4px}
.ai p{margin:6px 0 0}
.tickers{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tickers span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--sub)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
<header><h1>📋 장전 브리핑</h1><span class="date" id="date"></span></header>

<section class="card">
  <h2>📌 주도섹터 관리</h2>
  <div class="row" style="margin-top:8px">
    <input id="in" placeholder="섹터 입력 (쉼표로 여러 개: 반도체, 전력기기)">
    <button class="add" id="add">+ 추가</button>
  </div>
  <div class="chips" id="chips"></div>
</section>

<button class="card load" id="load">🔍 오늘 장전 뉴스 불러오기</button>
<div class="status" id="status"></div>
<div id="out"></div>
</main>

<script>
let sectors=[["반도체",0],["이란전쟁",0],["통신",0],["2차전지",0],["원전",0],["전력기기",0],["우주항공",0],["조선",0]];
let loaded=false;
const $=id=>document.getElementById(id);
const d=new Date();$("date").textContent=`${d.getMonth()+1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function renderChips(){
  $("chips").innerHTML=sectors.map((s,i)=>`<span class="chip ${i<3?'top':''}"><span class="rank">${i+1}위</span>${esc(s[0])}<button class="x" data-i="${i}" aria-label="${esc(s[0])} 삭제">✕</button></span>`).join("");
}
$("chips").onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){sectors.splice(+i,1);renderChips();}};
function addSectors(){
  $("in").value.split(",").map(s=>s.trim()).filter(Boolean).forEach(n=>{if(!sectors.find(s=>s[0]===n))sectors.push([n,0]);});
  $("in").value="";renderChips();
}
$("add").onclick=addSectors;
$("in").onkeydown=e=>{if(e.key==="Enter")addSectors();};

async function fetchNews(q){
  const r=await fetch("/api/news?q="+encodeURIComponent(q));
  const j=await r.json();
  if(!r.ok)throw new Error(typeof j.error==="string"?j.error:JSON.stringify(j.error));
  return j.items;
}
const fmt=s=>{const t=new Date(s);return isNaN(t)?"":`${t.getMonth()+1}.${t.getDate()} ${t.getHours()}:${String(t.getMinutes()).padStart(2,"0")}`;};
const newsHtml=n=>n.map(x=>`<div class="news"><a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.title)}</a><span>${esc(x.source)} ${fmt(x.pubDate)} ↗</span></div>`).join("");

$("load").onclick=async()=>{
  $("status").style.color="";$("status").textContent="불러오는 중…";$("out").innerHTML="";
  const jobs=[{title:"🌐 전일 미장 핫이슈",q:"뉴욕증시 마감"},...sectors.map((s,i)=>({title:"★ "+s[0],q:s[0]+" 주가",badge:i<3?`${i+1}순위 주도`:""}))];
  const res=await Promise.allSettled(jobs.map(j=>fetchNews(j.q)));
  let ok=0,total=0,err="";
  $("out").innerHTML=res.map((r,i)=>{
    const j=jobs[i];
    let body;
    if(r.status==="fulfilled"){ok++;total+=r.value.length;body=newsHtml(r.value);}
    else{err=r.reason.message;body=`<div class="news"><span>불러오기 실패: ${esc(r.reason.message)}</span></div>`;}
    const n=r.status==="fulfilled"?r.value.length:0;
    return `<section class="card"><div class="sec-h"><h2>${esc(j.title)}${j.badge?`<span class="badge">${j.badge}</span>`:""}</h2><span class="cnt">${n}건</span></div>${body}</section>`;
  }).join("");
  $("status").style.color=err?"#dc2626":"#16a34a";
  $("status").textContent=err?`일부 실패: ${err}`:`완료 ✅ ${ok}개 섹션 · 기사 ${total}건`;
};
renderChips();
</script>
</body>
</html>
